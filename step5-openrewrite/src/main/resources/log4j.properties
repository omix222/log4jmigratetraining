# OpenRewrite は Java コードを変換するが、設定ファイルは変換しない。
# 設定ファイルの変換には Step 6 の Log4j1ConfigurationConverter を使う。
log4j.rootLogger=DEBUG, Console

log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} [orderId=%X{orderId}] - %m%n

log4j.logger.com.example=DEBUG
