# log4j 1.x の設定ファイル (properties 形式) — 変換ツールの入力サンプル
#
# 含まれるパターン:
#   - ConsoleAppender        → log4j2: Console
#   - FileAppender           → log4j2: File
#   - RollingFileAppender    → log4j2: RollingFile (SizeBasedTriggeringPolicy)
#   - DailyRollingFileAppender → log4j2: RollingFile (TimeBasedTriggeringPolicy)
#   - PatternLayout          → log4j2: PatternLayout
#   - ロガー階層と additivity 設定

# ルートロガー: INFO 以上を Console と RollingFile へ
log4j.rootLogger=INFO, Console, RollingFile

# -----------------------------------------------------------------------
# Appender 定義
# -----------------------------------------------------------------------

# [1] ConsoleAppender — 開発環境向け
log4j.appender.Console=org.apache.log4j.ConsoleAppender
log4j.appender.Console.Target=System.out
log4j.appender.Console.Threshold=DEBUG
log4j.appender.Console.layout=org.apache.log4j.PatternLayout
log4j.appender.Console.layout.ConversionPattern=%d{HH:mm:ss.SSS} [%t] %-5p %c{1} [%X{orderId}] - %m%n

# [2] FileAppender — シンプルなファイル出力
log4j.appender.AppFile=org.apache.log4j.FileAppender
log4j.appender.AppFile.File=target/app.log
log4j.appender.AppFile.Append=true
log4j.appender.AppFile.layout=org.apache.log4j.PatternLayout
log4j.appender.AppFile.layout.ConversionPattern=%d{ISO8601} [%t] %-5p %c - %m%n

# [3] RollingFileAppender — サイズベースのローリング
log4j.appender.RollingFile=org.apache.log4j.RollingFileAppender
log4j.appender.RollingFile.File=target/rolling.log
log4j.appender.RollingFile.MaxFileSize=10MB
log4j.appender.RollingFile.MaxBackupIndex=5
log4j.appender.RollingFile.layout=org.apache.log4j.PatternLayout
log4j.appender.RollingFile.layout.ConversionPattern=%d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %-5p %c{2} - %m%n

# [4] DailyRollingFileAppender — 日次ローリング
log4j.appender.DailyFile=org.apache.log4j.DailyRollingFileAppender
log4j.appender.DailyFile.File=target/daily.log
log4j.appender.DailyFile.DatePattern='.'yyyy-MM-dd
log4j.appender.DailyFile.layout=org.apache.log4j.PatternLayout
log4j.appender.DailyFile.layout.ConversionPattern=%d %-5p [%t] %c{2} - %m%n

# -----------------------------------------------------------------------
# ロガー設定
# -----------------------------------------------------------------------

# アプリ全体: DEBUG レベル (Console と RollingFile に出力)
log4j.logger.com.example=DEBUG, Console, RollingFile
log4j.additivity.com.example=false

# DB 関連: WARN のみ DailyFile に (rootLogger への伝播なし)
log4j.logger.com.example.database=WARN, DailyFile
log4j.additivity.com.example.database=false

# 外部ライブラリのログを抑制
log4j.logger.org.springframework=WARN
log4j.logger.org.hibernate=ERROR
